[package]
name = "focus-board"
version = "0.1.0"
edition = "2024"
description = "A shared board of open questions: the owner answers on a page, sessions write through a command."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[dev-dependencies]
tempfile = "3"
